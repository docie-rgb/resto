title: resto
description: 프로젝트 진행 기록
author: docie-rgb
lang: ko
timezone: Asia/Seoul

url: https://docie-rgb.github.io
baseurl: /resto

permalink: /posts/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - .gitignore
