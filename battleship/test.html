<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배틀쉽 로직 테스트</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; background: #0f1117; color: #e6e8ee; padding: 16px; }
  .pass { color: #4ade80; } .fail { color: #ff6b6b; font-weight: 700; }
  li { margin: 2px 0; } h2 { margin-top: 20px; font-size: 1.05rem; }
  #summary { font-size: 1.2rem; font-weight: 700; }
</style>
</head>
<body>
<h1>배틀쉽 로직 테스트</h1>
<p id="summary">실행 중…</p>
<div id="out"></div>
<script src="game.js"></script>
<script src="ai.js"></script>
<script src="setup.js"></script>
<script>
'use strict';
const B = window.Battleship, AI = window.BattleshipAI, S = B.STATE;
const out = document.getElementById('out');
const results = { pass: 0, fail: 0, failures: [] };
let list;

function section(title) {
  const h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
  list = document.createElement('ul'); out.appendChild(list);
}
function check(name, cond, detail = '') {
  const li = document.createElement('li');
  li.className = cond ? 'pass' : 'fail';
  li.textContent = (cond ? '✔ ' : '✘ ') + name + (detail ? ` — ${detail}` : '');
  list.appendChild(li);
  if (cond) results.pass++; else { results.fail++; results.failures.push(name + ' ' + detail); }
}
function test(name, fn) {
  try { fn(); } catch (e) { check(name + ' (예외)', false, e.message); }
}
const idx = (coord) => (Number(coord.slice(1)) - 1) * 10 + (coord.charCodeAt(0) - 65);
const ship = (dir, ...coords) => ({ length: coords.length, dir, cells: coords.map(idx) });

// 테스트용 고정 함대 (규칙을 만족하는 배치)
const FIXED = [
  ship('H', 'A1', 'B1', 'C1', 'D1', 'E1'),
  ship('H', 'G1', 'H1', 'I1', 'J1'),
  ship('H', 'A3', 'B3', 'C3', 'D3'),
  ship('H', 'F3', 'G3', 'H3'),
  ship('V', 'J3', 'J4', 'J5'),
  ship('H', 'A5', 'B5', 'C5'),
  ship('H', 'E5', 'F5'),
  ship('H', 'A7', 'B7'),
  ship('H', 'D7', 'E7'),
  ship('H', 'G7', 'H7'),
];
const empties = (board) => board.cells.filter((c) => c.shipId < 0 && !c.revealed && !c.attacked).map((c) => c.index);

function validateFleet(ships) {
  const owner = new Array(100).fill(-1);
  const errs = [];
  if (ships.length !== 10) errs.push('척수 ' + ships.length);
  const lens = ships.map((s) => s.length).sort((a, b) => b - a).join(',');
  if (lens !== B.FLEET.slice().sort((a, b) => b - a).join(',')) errs.push('구성 ' + lens);
  let total = 0;
  ships.forEach((s, k) => {
    total += s.cells.length;
    if (s.cells.length !== s.length) errs.push('길이 불일치');
    const rows = s.cells.map(B.rowOf), cols = s.cells.map(B.colOf);
    const straightH = rows.every((r) => r === rows[0]) && cols.every((c, j) => c === cols[0] + j);
    const straightV = cols.every((c) => c === cols[0]) && rows.every((r, j) => r === rows[0] + j);
    if (!straightH && !straightV) errs.push('직선 아님');
    s.cells.forEach((i) => {
      if (i < 0 || i >= 100) errs.push('격자 밖');
      if (owner[i] !== -1) errs.push('겹침');
      owner[i] = k;
    });
  });
  if (total !== 30) errs.push('칸 수 ' + total);
  ships.forEach((s, k) => s.cells.forEach((i) => B.neighbors8(i).forEach((n) => {
    if (owner[n] !== -1 && owner[n] !== k) errs.push('인접');
  })));
  return errs;
}

// ================= 14.1 함선 배치 =================
section('14.1 함선 배치');
test('고정 배치 자체 검증', () => check('테스트용 고정 함대가 규칙을 만족', validateFleet(FIXED).length === 0, validateFleet(FIXED).join(',')));
test('무작위 배치 반복', () => {
  let bad = 0, firstErr = '';
  const t0 = performance.now();
  for (let s = 1; s <= 2000; s++) {
    const errs = validateFleet(B.placeFleet(B.mulberry32(s)));
    if (errs.length) { bad++; firstErr = firstErr || `seed ${s}: ${errs[0]}`; }
  }
  const ms = performance.now() - t0;
  check('2000회 무작위 배치: 10척 / 30칸 / 격자 내부 / 겹침·인접 없음', bad === 0, bad ? firstErr : `평균 ${(ms / 2000).toFixed(2)}ms`);
  const g = new B.Game();
  check('Math.random 기본 배치도 유효', validateFleet(g.player.board.ships).length === 0 && validateFleet(g.cpu.board.ships).length === 0);
});
test('배치 변경', () => {
  const g = new B.Game({ rng: B.mulberry32(7) });
  const before = JSON.stringify(g.player.board.ships.map((s) => s.cells));
  check('READY 상태에서 배치 변경 가능', g.rerollPlayerFleet() && JSON.stringify(g.player.board.ships.map((s) => s.cells)) !== before);
  g.start();
  check('시작 후에는 배치 변경 불가', g.rerollPlayerFleet() === false);
});

// ================= 14.2 포격 =================
section('14.2 포격 / 턴');
test('선공과 턴', () => {
  const g = new B.Game({ playerShips: FIXED, cpuShips: FIXED });
  check('시작 전에는 포격 불가', g.fire('player', 0) === null && g.state === S.READY);
  g.start();
  check('플레이어 선공', g.state === S.PLAYER_TURN && g.turn === 'player');
  check('플레이어 차례에 CPU는 포격 불가', g.fire('cpu', 0) === null);

  const r1 = g.fire('player', idx('A1'));
  check('명중 판정', r1 && r1.hit && g.cpu.board.cells[idx('A1')].result === 'hit');
  check('결과 처리 중(RESOLVING_ATTACK)에는 추가 입력 차단', g.state === S.RESOLVING_ATTACK && g.fire('player', idx('B1')) === null);
  g.finishResolve();
  check('명중 시 추가 공격권', g.state === S.PLAYER_TURN);
  check('같은 칸 재공격 불가', g.fire('player', idx('A1')) === null && g.player.shots === 1);

  const r2 = g.fire('player', idx('J10'));
  check('빗나감 판정', r2 && !r2.hit && g.cpu.board.cells[idx('J10')].result === 'miss');
  g.finishResolve();
  check('빗나가면 CPU 턴', g.state === S.CPU_TURN && g.turn === 'cpu');
  check('CPU 턴에 플레이어 포격 / 핵폭탄 조준 불가', g.fire('player', idx('B1')) === null && !g.enterNukeTargeting());

  const r3 = g.fire('cpu', idx('A1'));
  g.finishResolve();
  check('CPU도 명중 시 계속 공격', r3.hit && g.state === S.CPU_TURN);
  g.fire('cpu', idx('J10')); g.finishResolve();
  check('CPU가 빗나가면 플레이어 턴', g.state === S.PLAYER_TURN);
  check('포격 기록 (명중/빗나감)', g.player.hits.length === 1 && g.player.misses.length === 1 && g.cpu.shots === 2);
});
test('격침 판정', () => {
  const g = new B.Game({ playerShips: FIXED, cpuShips: FIXED });
  g.start();
  const tgt = g.cpu.board;
  ['A7'].forEach((c) => { g.fire('player', idx(c)); g.finishResolve(); });
  check('일부만 명중하면 격침 아님', !tgt.ships[7].sunk);
  const r = g.fire('player', idx('B7')); g.finishResolve();
  check('모든 칸 명중 시 격침', tgt.ships[7].sunk && r.sunk.length === 1 && r.sunk[0].id === 7);
  check('격침 후에도 추가 공격권', g.state === S.PLAYER_TURN);
  const around = ['A6', 'B6', 'C6', 'C7', 'A8', 'B8', 'C8'].map(idx);
  check('격침 함선 주변 1칸 자동 확인', around.every((i) => tgt.cells[i].revealed && !tgt.cells[i].attacked));
  check('자동 확인 칸은 포격 횟수에 미포함', g.player.shots === 2);
  check('자동 확인 칸에는 포격 불가', g.fire('player', idx('A8')) === null);
});

// ================= 14.3 핵폭탄 =================
section('14.3 핵폭탄');
test('획득 규칙 (턴 단위)', () => {
  const g = new B.Game({ playerShips: FIXED, cpuShips: FIXED });
  g.start();
  check('첫 턴 시작 시 게이지 1', g.player.nukeCounter === 1 && g.cpu.nukeCounter === 0);
  // 같은 턴의 연속 명중은 게이지를 올리지 않는다.
  ['A1', 'B1', 'C1', 'D1'].forEach((c) => { g.fire('player', idx(c)); g.finishResolve(); });
  check('연속 명중 4회는 같은 턴 → 게이지 그대로', g.player.nukeCounter === 1 && g.player.nukes === 0);
  const toCpu = g.fire('player', idx('J10')); g.finishResolve();
  check('턴이 넘어가면 상대 게이지 +1', g.cpu.nukeCounter === 1 && g.player.nukeCounter === 1 && toCpu.nukeGainedBy === null);

  // 서로 빗나가며 턴을 주고받는다: 플레이어 턴이 5번째로 시작될 때 획득
  const cpuMiss = empties(g.cpu.board), playerMiss = empties(g.player.board);
  let k = 0, gained = null;
  while (g.player.nukes === 0 && k < 10) {
    const out = g.fire('cpu', playerMiss[k]); g.finishResolve();
    if (out.nukeGainedBy === 'player') gained = g.player.nukeCounter;
    if (g.player.nukes) break;
    g.fire('player', cpuMiss[k++]); g.finishResolve();
  }
  check('자기 턴 5번 시작마다 핵폭탄 1개, 게이지 0으로', g.player.nukes === 1 && gained === 0 && k === 3, `플레이어 빗나감 ${k}회 후`);
  check('CPU도 같은 규칙', g.cpu.nukeCounter === 4 && g.cpu.nukes === 0);

  // 보유 중에는 5턴이 더 지나도 추가 지급 없음
  for (let n = 0; n < 5; n++) {
    g.fire('player', cpuMiss[k++]); g.finishResolve();
    g.fire('cpu', playerMiss[k]); g.finishResolve();
  }
  check('보유 중이면 추가 지급 없음 (최대 1개)', g.player.nukes === 1 && g.player.nukeCounter === 0);
});

function nukeReadyGame(cpuShips = FIXED) {
  const g = new B.Game({ playerShips: FIXED, cpuShips });
  g.start();
  g.player.nukes = 1;
  return g;
}
test('범위와 가장자리', () => {
  const g = nukeReadyGame();
  check('3×3 범위 (중앙 9칸)', B.area3x3(idx('E5')).length === 9);
  check('모서리 A1 → 4칸', B.area3x3(idx('A1')).length === 4);
  check('가장자리 E1 → 6칸', B.area3x3(idx('E1')).length === 6);
  check('J10 → 4칸, 격자 밖 좌표 없음', B.area3x3(99).every((i) => i >= 0 && i < 100) && B.area3x3(99).length === 4);
  check('조준 모드 진입', g.enterNukeTargeting() && g.state === S.PLAYER_NUKE_TARGETING);
  check('조준 중 일반 포격 불가', g.fire('player', 0) === null);
  check('취소하면 플레이어 차례로 복귀, 보유 유지', g.cancelNuke() && g.state === S.PLAYER_TURN && g.player.nukes === 1);
  check('조준 모드가 아니면 핵폭탄 불가', g.nuke('player', 0) === null);
  g.enterNukeTargeting();
  const out = g.nuke('player', idx('J10'));
  check('모서리 핵폭탄 정상 처리 (4칸 공격)', out && out.results.length === 4 && g.player.nukes === 0);
  check('핵폭탄은 획득 카운트·일반 포격 횟수에 미포함', g.player.nukeCounter === 1 && g.player.shots === 0);
});
test('이미 공격한 칸 제외 / 빈 범위 사용 불가', () => {
  const g = nukeReadyGame();
  g.fire('player', idx('I9')); g.finishResolve();
  g.fire('cpu', idx('J10')); g.finishResolve();
  g.player.nukes = 1;
  g.enterNukeTargeting();
  const targets = g.nukeTargets('player', idx('J10'));
  check('이미 공격한 칸은 대상에서 제외', targets.length === 3 && !targets.includes(idx('I9')));
  const out = g.nuke('player', idx('J10'));
  check('새 칸만 판정, 중복 기록 없음', out.results.length === 3 && g.player.misses.filter((i) => i === idx('I9')).length === 1);
  check('명중 없으면 턴 넘김', g.finishResolve() && g.state === S.CPU_TURN);

  // 새로운 대상이 없는 범위
  const g2 = nukeReadyGame();
  g2.fire('player', idx('A7')); g2.finishResolve();
  g2.fire('player', idx('B7')); g2.finishResolve(); // 격침 → 주변 확인
  // A8 중심: A7,B7(격침),A8,B8,C7,C8(확인),A9,B9 → A9,B9 는 미확인 → 대상 있음
  g2.fire('player', idx('A9')); g2.finishResolve();
  g2.fire('cpu', idx('J10')); g2.finishResolve();
  g2.fire('player', idx('B9')); g2.finishResolve();
  g2.fire('cpu', idx('I10')); g2.finishResolve();
  g2.player.nukes = 1;
  g2.enterNukeTargeting();
  check('새 공격 대상이 없으면 사용 불가', g2.nukeTargets('player', idx('A8')).length === 0 && g2.nuke('player', idx('A8')) === null);
  check('사용 실패 시 보유량·상태 유지', g2.player.nukes === 1 && g2.state === S.PLAYER_NUKE_TARGETING);
});
test('여러 함선 동시 격침', () => {
  // 3×3 안에 2칸 함선 두 척 (행 1과 행 3, 서로 인접하지 않음)
  const cpu = [
    ship('H', 'A1', 'B1'), ship('H', 'A3', 'B3'),
    ship('H', 'E1', 'F1', 'G1', 'H1', 'I1'),
    ship('H', 'E3', 'F3', 'G3', 'H3'), ship('H', 'A5', 'B5', 'C5', 'D5'),
    ship('H', 'F5', 'G5', 'H5'), ship('H', 'A7', 'B7', 'C7'), ship('H', 'E7', 'F7', 'G7'),
    ship('H', 'I7', 'J7'), ship('H', 'A9', 'B9'),
  ];
  check('테스트 함대 유효', validateFleet(cpu).length === 0, validateFleet(cpu).join(','));
  const g = nukeReadyGame(cpu);
  g.enterNukeTargeting();
  const out = g.nuke('player', idx('B2'));
  check('두 척 동시 격침', out.sunk.length === 2 && g.cpu.board.ships[0].sunk && g.cpu.board.ships[1].sunk);
  check('격침된 함선은 한 번씩만 기록', out.results.filter((r) => r.sunk).length === 2);
  g.finishResolve();
  check('명중이 있으면 추가 공격권은 한 번 (플레이어 차례 유지)', g.state === S.PLAYER_TURN && g.player.nukes === 0);
});
test('핵폭탄으로 마지막 함선 격침 → 즉시 승리', () => {
  const g = nukeReadyGame();
  const board = g.cpu.board;
  // 마지막 2칸 함선(G7,H7)만 남기고 모두 격침
  board.ships.forEach((s, k) => { if (k !== 9) s.cells.forEach((i) => B.attackCell(board, i)); });
  g.enterNukeTargeting();
  const out = g.nuke('player', idx('G7'));
  check('즉시 GAME_OVER, 플레이어 승리', out.gameOver && g.state === S.GAME_OVER && g.winner === 'player');
});

// ================= 14.5 승패 =================
section('14.5 승패 / 재시작');
test('승패', () => {
  const g = new B.Game({ playerShips: FIXED, cpuShips: FIXED });
  g.start();
  const cells = FIXED.flatMap((s) => s.cells);
  let out;
  cells.forEach((i) => { out = g.fire('player', i); if (g.state === S.RESOLVING_ATTACK) g.finishResolve(); });
  check('10척 격침 시 즉시 승리', out.gameOver && g.winner === 'player' && g.state === S.GAME_OVER);
  check('게임 종료 후 포격·핵폭탄 차단', g.fire('player', idx('J10')) === null && g.fire('cpu', 0) === null && !g.enterNukeTargeting());
  check('종료 후 finishResolve 로 상태 변경 불가', !g.finishResolve() && g.state === S.GAME_OVER);

  const g2 = new B.Game({ playerShips: FIXED, cpuShips: FIXED });
  g2.start();
  g2.fire('player', idx('J10')); g2.finishResolve();
  cells.forEach((i) => { out = g2.fire('cpu', i); if (g2.state === S.RESOLVING_ATTACK) g2.finishResolve(); });
  check('내 함선 10척 격침 시 즉시 패배', out.gameOver && g2.winner === 'cpu');

  const g3 = new B.Game();
  check('새 게임은 초기 상태', g3.state === S.READY && g3.player.shots === 0 && g3.cpu.nukes === 0 &&
    g3.player.nukeCounter === 0 && g3.cpu.board.cells.every((c) => !c.attacked && !c.revealed) && g3.winner === null);
});

// ================= 14.4 CPU =================
section('14.4 CPU 전략');
test('공개 정보', () => {
  const g = new B.Game({ rng: B.mulberry32(3) });
  const v = B.publicView(g.player.board);
  check('공격 전 공개 정보에 함선 위치 없음', v.cells.every((s) => s === 'unknown') && v.remaining.length === 10);
});
test('숨겨진 배치와 무관한 결정', () => {
  // 서로 다른 두 배치에 "둘 다 빈 칸"만 똑같이 공격 → 공개 정보 동일 → 같은 시드면 같은 결정
  let same = 0, trials = 0;
  for (let s = 1; s <= 50; s++) {
    const a = B.createBoard(B.placeFleet(B.mulberry32(s)));
    const b = B.createBoard(B.placeFleet(B.mulberry32(s + 1000)));
    const common = a.cells.filter((c) => c.shipId < 0 && b.cells[c.index].shipId < 0).map((c) => c.index);
    B.shuffle(common, B.mulberry32(s)).slice(0, 25).forEach((i) => { B.attackCell(a, i); B.attackCell(b, i); });
    const va = B.publicView(a), vb = B.publicView(b);
    if (JSON.stringify(va) !== JSON.stringify(vb)) continue;
    trials++;
    const da = AI.decide(va, s % 2 === 0, B.mulberry32(s));
    const db = AI.decide(vb, s % 2 === 0, B.mulberry32(s));
    if (da.type === db.type && da.index === db.index) same++;
  }
  check('공개 정보가 같으면 결정도 같음 (숨겨진 위치 미참조)', trials > 0 && same === trials, `${same}/${trials}`);
});
test('추적 모드', () => {
  const board = B.createBoard(FIXED);
  B.attackCell(board, idx('C3')); // 4칸 함선 A3~D3 중앙
  const shot = AI.chooseShot(B.publicView(board), B.mulberry32(1));
  const orth = ['C2', 'C4', 'B3', 'D3'].map(idx);
  check('명중 1칸 → 상하좌우 중 공격', orth.includes(shot), B.coordName(shot));
  B.attackCell(board, idx('D3'));
  const seen = new Set();
  for (let s = 1; s <= 30; s++) seen.add(AI.chooseShot(B.publicView(board), B.mulberry32(s)));
  const line = ['B3', 'E3'].map(idx);
  check('연속 명중 2칸 → 같은 방향(가로)으로 이어서 공격', [...seen].every((i) => line.includes(i)), [...seen].map(B.coordName).join(','));
  check('대각선 칸은 함선이 없다고 추론', AI.deduce(B.publicView(board).cells)[idx('B2')] === 'safe');
});
test('격침 주변 / 미공격 좌표만 선택 (CPU 대 CPU 200판)', () => {
  let invalid = 0, nukeOver = 0, turnErr = 0, unfinished = 0, totalActions = 0, nukesUsed = 0;
  let firstErr = '';
  for (let s = 1; s <= 200; s++) {
    const rng = B.mulberry32(s);
    const g = new B.Game({ rng });
    g.start();
    let guard = 0;
    while (g.state !== S.GAME_OVER && guard++ < 400) {
      const me = g.turn, opp = g.other(me);
      const view = B.publicView(g[opp].board);
      const act = AI.decide(view, g[me].nukes > 0, rng);
      if (me === 'player' && act.type === 'nuke') g.enterNukeTargeting();
      const pick = act.index;
      if (act.type === 'shot' && view.cells[pick] !== 'unknown') { invalid++; firstErr = firstErr || `seed ${s} ${view.cells[pick]}`; }
      const out = act.type === 'nuke' ? g.nuke(me, pick) : g.fire(me, pick);
      if (!out) { invalid++; firstErr = firstErr || `seed ${s} 거부됨 ${act.type}`; break; }
      totalActions++;
      if (act.type === 'nuke') nukesUsed++;
      if (g.player.nukes > 1 || g.cpu.nukes > 1) nukeOver++;
      if (!out.gameOver) {
        const expect = out.hit ? me : opp;
        if (out.next !== expect) turnErr++;
        g.finishResolve();
      } else if (!g[opp].board.ships.every((x) => x.sunk)) turnErr++;
    }
    if (g.state !== S.GAME_OVER) unfinished++;
  }
  check('CPU가 미공격·미확인 좌표만 선택', invalid === 0, firstErr);
  check('명중 → 계속, 빗나감 → 턴 넘김 규칙 위반 없음', turnErr === 0);
  check('핵폭탄 보유량이 1개를 넘지 않음', nukeOver === 0);
  check('200판 모두 정상 종료', unfinished === 0);
  check('핵폭탄을 실제로 사용', nukesUsed > 0, `총 ${nukesUsed}회, 판당 평균 행동 ${(totalActions / 200).toFixed(1)}회`);
});
test('AI 효율 (핵폭탄 없이 혼자 포격 시 평균 발수)', () => {
  let total = 0;
  for (let s = 1; s <= 100; s++) {
    const rng = B.mulberry32(s);
    const board = B.createBoard(B.placeFleet(rng));
    let n = 0;
    while (!B.allSunk(board) && n < 100) { B.attackCell(board, AI.chooseShot(B.publicView(board), rng)); n++; }
    total += n;
  }
  const avg = total / 100;
  check('무작위(약 95발)보다 효율적', avg < 80, `평균 ${avg.toFixed(1)}발`);
});

// ================= 함대 구성 / 배치 화면 =================
section('함대 구성과 수량 상한');
const Setup = window.BattleshipSetup;
test('배치 가능 판정', () => {
  check('기본 함대 배치 가능', B.canPlaceFleet(B.FLEET));
  check('격자보다 긴 배는 불가', !B.canPlaceFleet([11]));
  check('지나치게 많은 배는 불가 (2칸 40척)', !B.canPlaceFleet(Array(40).fill(2)));
  const t0 = performance.now();
  const caps = {};
  [5, 4, 3, 2].forEach((len) => {
    let n = 0;
    while (B.canPlaceFleet(Array(n + 1).fill(len))) n++;
    caps[len] = n;
  });
  const ms = performance.now() - t0;
  check('종류별 단독 최대 수량 계산', caps[5] >= 5 && caps[2] >= 15, `5칸 ${caps[5]} · 4칸 ${caps[4]} · 3칸 ${caps[3]} · 2칸 ${caps[2]}척 (${ms.toFixed(0)}ms)`);
  let bad = 0;
  [5, 4, 3, 2].forEach((len) => {
    for (let s = 1; s <= 10; s++) {
      const ships = B.placeFleet(B.mulberry32(s * len), Array(caps[len]).fill(len));
      if (!B.validateShips(ships) || ships.length !== caps[len]) bad++;
    }
  });
  check('상한 수량에서도 무작위 배치가 항상 유효', bad === 0);
});
test('사용자 지정 함대로 게임 진행', () => {
  let errors = 0, unfinished = 0;
  for (let s = 1; s <= 40; s++) {
    const rng = B.mulberry32(s);
    const fleet = [];
    [5, 4, 3, 2].forEach((len) => { const n = Math.floor(rng() * 4); for (let k = 0; k < n; k++) fleet.push(len); });
    if (!fleet.length) fleet.push(2);
    if (!B.canPlaceFleet(fleet)) continue;
    const g = new B.Game({ rng, fleet });
    if (!B.validateShips(g.player.board.ships) || !B.sameFleet(g.cpu.board.ships.map((x) => x.length), fleet)) errors++;
    g.start();
    let guard = 0;
    while (g.state !== S.GAME_OVER && guard++ < 400) {
      const me = g.turn;
      const act = AI.decide(B.publicView(g[g.other(me)].board), g[me].nukes > 0, rng);
      if (me === 'player' && act.type === 'nuke') g.enterNukeTargeting();
      const out = act.type === 'nuke' ? g.nuke(me, act.index) : g.fire(me, act.index);
      if (!out) { errors++; break; }
      if (!out.gameOver) g.finishResolve();
    }
    if (g.state !== S.GAME_OVER) unfinished++;
  }
  check('무작위 구성 40판: 배치 유효, 규칙 위반 없이 종료', errors === 0 && unfinished === 0, `오류 ${errors}, 미종료 ${unfinished}`);
  check('공개 정보의 남은 함선 = 미격침 함선 길이', (() => {
    const b = B.createBoard([ship('H', 'A1', 'B1'), ship('H', 'D1', 'E1', 'F1')]);
    B.attackCell(b, idx('A1')); B.attackCell(b, idx('B1'));
    return B.publicView(b).remaining.join() === '3';
  })());
});

section('배치 화면 (수량 · 끌기 · 회전 · 항구)');
test('수량 설정', () => {
  const st = new Setup.FleetSetup([2]);
  check('마지막 1척은 줄일 수 없음 (최소 1척)', !st.canChange(2, -1) && !st.change(2, -1));
  check('늘린 배는 항구로', st.change(5, 1) && st.harborCount(5) === 1 && !st.allPlaced());
  const g = new B.Game({ fleet: st.fleet(), playerShips: st.placedShips() });
  check('항구에 배가 남아 있으면 게임 시작 불가', !g.canStart() && !g.start());
  st.randomize();
  g.setPlayerShips(st.placedShips());
  check('모두 배치하면 시작 가능', st.allPlaced() && g.start());

  const full = new Setup.FleetSetup(B.FLEET);
  let n = 0;
  while (full.canChange(2, 1)) { full.change(2, 1); n++; }
  check('규칙상 더 넣을 수 없으면 늘리기 불가', !full.change(2, 1) && B.canPlaceFleet(full.fleet()) && !B.canPlaceFleet(full.fleet().concat(2)), `기본 함대에 2칸 ${n}척 추가 가능`);
  full.randomize();
  check('상한까지 늘린 함대도 무작위 배치 가능', full.allPlaced() && B.validateShips(full.placedShips()));
  full.change(5, -1);
  check('줄이면 해당 종류가 빠짐', full.count(5) === 0);
});
test('이동 · 밀어내기 · 회전 · 항구', () => {
  const st = new Setup.FleetSetup([4, 3, 2]);
  st.clear();
  const [a, b, c] = st.ships;
  st.place(a.id, 0, 0, 'H');               // A1~D1
  st.place(b.id, 4, 4, 'V');               // E5~E7
  check('빈자리 배치', B.validateShips(st.placedShips()) && a.cells[0] === idx('A1') && b.cells.length === 3);
  const res = st.place(c.id, 1, 1, 'H');   // B2~C2: 전함과 닿음 → 전함을 밀어냄
  check('겹치거나 닿는 배는 가까운 빈자리로 밀려남', res.moved.includes(a.id) && B.validateShips(st.placedShips()) && c.cells[0] === idx('B2'));
  st.place(b.id, 8, 9, 'V');
  check('격자 밖이면 안쪽으로 맞춤', b.cells[0] === idx('J8') && b.cells[2] === idx('J10'));
  const before = b.dir;
  st.rotate(b.id);
  check('클릭 회전: 가로/세로 전환 후에도 격자 안', b.dir !== before && B.validateShips(st.placedShips()) && b.cells.every((i) => i >= 0 && i < 100));
  st.toHarbor(b.id);
  check('항구로 보내기', !b.cells && st.harborCount(3) === 1 && !st.allPlaced());

  // 빈자리가 없으면 항구로: 2칸 상한 + 그 위에 계속 놓기
  const crowd = new Setup.FleetSetup([2]);
  while (crowd.canChange(2, 1)) crowd.change(2, 1);
  crowd.randomize();
  let harbored = 0;
  const rng = B.mulberry32(5);
  for (let t = 0; t < 30; t++) {
    const s = crowd.ships[Math.floor(rng() * crowd.ships.length)];
    const r = crowd.place(s.id, Math.floor(rng() * 10), Math.floor(rng() * 10), rng() < 0.5 ? 'H' : 'V');
    harbored += r.harbored.length;
  }
  check('자리가 없을 정도로 꽉 차면 밀려난 배는 항구로', harbored > 0 && B.validateShips(crowd.placedShips()), `항구행 ${harbored}척`);
});
test('무작위 조작 1000회 후에도 배치 규칙 유지', () => {
  const rng = B.mulberry32(77);
  const st = new Setup.FleetSetup(B.FLEET, rng);
  st.randomize();
  let bad = 0;
  for (let t = 0; t < 1000; t++) {
    const s = st.ships[Math.floor(rng() * st.ships.length)];
    const op = rng();
    if (op < 0.6) st.place(s.id, Math.floor(rng() * 10), Math.floor(rng() * 10), rng() < 0.5 ? 'H' : 'V');
    else if (op < 0.85) st.rotate(s.id);
    else if (op < 0.95) st.toHarbor(s.id);
    else st.change([5, 4, 3, 2][Math.floor(rng() * 4)], rng() < 0.5 ? 1 : -1);
    if (!B.validateShips(st.placedShips()) || !B.canPlaceFleet(st.fleet()) || st.ships.length < 1) bad++;
  }
  check('겹침·인접·격자 밖 없음, 구성은 항상 배치 가능', bad === 0, `위반 ${bad}회`);
});

const sum = document.getElementById('summary');
sum.textContent = `통과 ${results.pass} / 실패 ${results.fail}`;
sum.className = results.fail ? 'fail' : 'pass';
window.testResults = results;
