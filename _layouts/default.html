<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">글</a>
        <a href="{{ '/tags/' | relative_url }}">태그</a>
        <a href="{{ '/tetris/' | relative_url }}">테트리스</a>
        <a href="{{ '/about/' | relative_url }}">소개</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      © {{ site.time | date: '%Y' }} {{ site.author }} ·
      <a href="https://github.com/docie-rgb/resto">GitHub</a>
    </div>
  </footer>
</body>
</html>
